[package]
name = "pentacles-server"
version = "0.1.0"
edition = "2021"

# SpacetimeDB modules compile to a WebAssembly system module.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the installed `spacetime` CLI / TS SDK (2.10.x). Keep these in lockstep:
# server crate, `spacetime` CLI, and the `spacetimedb` npm client SDK all on 2.10.
spacetimedb = "2.10"
log = "0.4"
sha2 = "0.10" # claim_profile: hash the one-time identity-link code
ed25519-dalek = { version = "2.1", default-features = false }
bs58 = "0.5"
# In-tree vendored ephemeris/astrology core crate for reproducible builds.
alchm-astro-core = { path = "vendor/alchm-astro-core" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
