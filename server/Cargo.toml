[package]
name = "pentacles-server"
version = "0.1.0"
edition = "2021"

# SpacetimeDB modules compile to a WebAssembly system module.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the installed `spacetime` CLI / TS SDK (2.6.x). Keep these in lockstep:
# server crate, `spacetime` CLI, and the `spacetimedb` npm client SDK all on 2.6.
spacetimedb = "2.6"
log = "0.4"
sha2 = "0.10" # claim_profile: hash the one-time identity-link code
ed25519-dalek = { version = "2.1", default-features = false }
bs58 = "0.5"
# Shared ephemeris/astrology core. It moved with the Solana migration: the old
# EthGlobalHackathon/AlchmAgentsETH-main path no longer exists on disk, so the
# module could not build at all until this was repointed. Still an absolute-ish
# path outside the repo — see docs/SOLANA_MAINNET_CONFORMANCE.md for the note on
# vendoring or publishing it before mainnet, so a clean checkout can build.
alchm-astro-core = { path = "../../../AlchmAgentsSolana/alchm-astro-core" }

[profile.release]
opt-level = "s"
lto = true
