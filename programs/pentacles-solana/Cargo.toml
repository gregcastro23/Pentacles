[package]
name = "pentacles-solana"
version = "0.1.0"
description = "Pentacles Solana Token-2022 Anchor Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "pentacles_solana"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
spl-transfer-hook-interface = "0.6.3"
spl-tlv-account-resolution = "0.6.3"

