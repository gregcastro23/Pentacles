name: CI

on:
  push:
    branches: [ main, "fix/*", "feat/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust format check
        run: cargo fmt --manifest-path server/Cargo.toml -- --check

      - name: Rust clippy lint
        run: cargo clippy --manifest-path server/Cargo.toml -- -D warnings

      - name: Rust module tests
        run: cargo test --manifest-path server/Cargo.toml

      - name: Bun test suite
        run: bun run test:all

      - name: Frontend build check
        run: bun run build
